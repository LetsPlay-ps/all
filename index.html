<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LET'S PLAY · PS4 GoldHEN Host</title>
  <link rel="icon" type="image/png" href="icon0.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="main-wrapper">
    <header class="header-card">
      <h1 class="brand-title">LET'S PLAY</h1>
      <p class="brand-subtitle">PS4 Exploit Suite · FW 5.05, 5.07 &amp; 7.00–14.00</p>
    </header>

    <div class="controller-stage">
      <img src="LP_controller.png" width="1080" height="695" alt="PS4 DualShock Controller" class="controller-base-img">
      <button type="button" class="ctrl-overlay-btn btn-dpad btn-dpad-up" data-firmware="13.52" title="FW 13.52 (D-Pad Up)" aria-label="Select FW 13.52 with D-Pad Up">▲</button>
      <button type="button" class="ctrl-overlay-btn btn-dpad btn-dpad-left" data-firmware="11.00" title="FW 11.00 (D-Pad Left)" aria-label="Select FW 11.00 with D-Pad Left">◀</button>
      <button type="button" class="ctrl-overlay-btn btn-dpad btn-dpad-right" data-firmware="12.00" title="FW 12.00 (D-Pad Right)" aria-label="Select FW 12.00 with D-Pad Right">▶</button>
      <button type="button" class="ctrl-overlay-btn btn-dpad btn-dpad-down" data-firmware="9.00" title="FW 9.00 (D-Pad Down)" aria-label="Select FW 9.00 with D-Pad Down">▼</button>
      <button type="button" class="ctrl-overlay-btn btn-shape btn-triangle" data-firmware="13.52" title="FW 13.52 (Triangle)" aria-label="Select FW 13.52 with Triangle">▲</button>
      <button type="button" class="ctrl-overlay-btn btn-shape btn-square" data-firmware="13.00" title="FW 13.00 (Square)" aria-label="Select FW 13.00 with Square">□</button>
      <button type="button" class="ctrl-overlay-btn btn-shape btn-circle" data-firmware="11.00" title="FW 11.00 (Circle)" aria-label="Select FW 11.00 with Circle">●</button>
      <button type="button" class="ctrl-overlay-btn btn-shape btn-cross" data-firmware="9.00" title="FW 9.00 (Cross)" aria-label="Select FW 9.00 with Cross">✖</button>
    </div>

    <section class="options-card" aria-label="Jailbreak options">
      <div class="option-group">
        <span class="option-label-title" id="chain-label">⚙ Exploit Chain</span>
        <div class="segmented-control" id="chains" role="radiogroup" aria-labelledby="chain-label">
          <input type="radio" name="chain" id="engine-auto" value="auto" checked>
          <label for="engine-auto">Auto (Smart)</label>
          <input type="radio" name="chain" id="engine-afterglow" value="afterglow">
          <label for="engine-afterglow">Afterglow (14.00)</label>
          <input type="radio" name="chain" id="engine-rthdr" value="rthdr">
          <label for="engine-rthdr">Poops/RTHDR (13.02–13.52)</label>
          <input type="radio" name="chain" id="engine-poops" value="poops">
          <label for="engine-poops">Poops (12.50–13.00)</label>
          <input type="radio" name="chain" id="engine-lapse" value="lapse">
          <label for="engine-lapse">Lapse (10.00–12.02)</label>
          <input type="radio" name="chain" id="engine-psfree" value="psfree">
          <label for="engine-psfree">PSFree (7.00–9.60)</label>
          <input type="radio" name="chain" id="engine-legacy" value="legacy">
          <label for="engine-legacy">5.05 WebKit</label>
        </div>
      </div>

      <div class="fw-selector-wrapper">
        <label class="option-label-title" for="target">Target FW</label>
        <select class="fw-dropdown" id="target">
          <option value="">Auto Detect</option>
        </select>
      </div>

      <div class="toggle-wrapper">
        <label class="switch" for="auto-launch">
          <input type="checkbox" id="auto-launch" disabled>
          <span class="slider" aria-hidden="true"></span>
        </label>
        <label for="auto-launch" class="option-label-title">Auto Exploit</label>
        <span id="countdown" class="countdown-badge" hidden></span>
        <button type="button" id="cancel-auto" class="cancel-auto-btn" hidden>Cancel</button>
      </div>
    </section>

    <div class="action-container">
      <button class="launch-btn" id="launch" type="button" disabled>🚀 Start Jailbreak</button>
      <a class="cache-action" id="install-cache" hidden>Install Offline Cache</a>
    </div>

    <section class="progress-card" aria-label="Host status">
      <div class="progress-header">
        <div class="progress-status-text" role="status"><span aria-hidden="true">⚡</span> <span id="msgs">Detecting your console…</span></div>
        <span class="progress-percentage" id="progress-value" aria-hidden="true">0%</span>
      </div>
      <div class="progress-track" id="progress" role="progressbar" aria-label="Jailbreak progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-fill"></div>
      </div>
      <details class="console-drawer">
        <summary class="debug-drawer-toggle">Show / Hide Console Log</summary>
        <pre id="host-log" class="debug-console"></pre>
      </details>
    </section>

    <footer>Created by Ahmed Elattar</footer>
    <noscript>Enable JavaScript to use the PS4 host.</noscript>
  </main>

  <!-- Logging hooks used by the jailbreak scripts. -->
  <pre id="console" hidden></pre>
  <div id="out" hidden></div>
  <span id="state" hidden></span>
  <script src="host.js"></script>
</body>
</html>
